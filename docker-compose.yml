services:
  auth-app:
    image: auth-app
    pull_policy: never
    build: .
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
      - HOST=0.0.0.0
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:17
    environment:
      - POSTGRES_PASSWORD=$POSTGRES_ROOT_PASSWORD
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8
    restart: unless-stopped


volumes:
  postgres_data:
